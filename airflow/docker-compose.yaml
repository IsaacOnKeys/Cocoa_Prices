# Sanitized runtime capture, 2026-10-26. Supply secret references externally.
{
  "name": "airflow",
  "networks": {
    "default": {
      "name": "airflow_default",
      "ipam": {}
    }
  },
  "services": {
    "airflow-init": {
      "command": [
        "-c",
        "if [[ -z \"1001\" ]]; then\n  echo\n  echo -e \"\\033[1;33mWARNING!!!: AIRFLOW_UID not set!\\e[0m\"\n  echo \"If you are on Linux, you SHOULD follow the instructions below to set \"\n  echo \"AIRFLOW_UID environment variable, otherwise files will be owned by root.\"\n  echo \"For other operating systems you can get rid of the warning with manually created .env file:\"\n  echo \"    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user\"\n  echo\n  export AIRFLOW_UID=$$(id -u)\nfi\none_meg=1048576\nmem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))\ncpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)\ndisk_available=$$(df / | tail -1 | awk '{print $$4}')\nwarning_resources=\"false\"\nif (( mem_available < 4000 )) ; then\n  echo\n  echo -e \"\\033[1;33mWARNING!!!: Not enough memory available for Docker.\\e[0m\"\n  echo \"At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))\"\n  echo\n  warning_resources=\"true\"\nfi\nif (( cpus_available < 2 )); then\n  echo\n  echo -e \"\\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\\e[0m\"\n  echo \"At least 2 CPUs recommended. You have $${cpus_available}\"\n  echo\n  warning_resources=\"true\"\nfi\nif (( disk_available < one_meg * 10 )); then\n  echo\n  echo -e \"\\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\\e[0m\"\n  echo \"At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))\"\n  echo\n  warning_resources=\"true\"\nfi\nif [[ $${warning_resources} == \"true\" ]]; then\n  echo\n  echo -e \"\\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\\e[0m\"\n  echo \"Please follow the instructions to increase amount of resources available:\"\n  echo \"   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin\"\n  echo\nfi\necho\necho \"Creating missing opt dirs if missing:\"\necho\nmkdir -v -p /opt/airflow/{logs,dags,plugins,config}\necho\necho \"Airflow version:\"\n/entrypoint airflow version\necho\necho \"Files in shared volumes:\"\necho\nls -la /opt/airflow/{logs,dags,plugins,config}\necho\necho \"Running airflow config list to create default config file if missing.\"\necho\n/entrypoint airflow config list >/dev/null\necho\necho \"Files in shared volumes:\"\necho\nls -la /opt/airflow/{logs,dags,plugins,config}\necho\necho \"Change ownership of files in /opt/airflow to 1001:0\"\necho\nchown -R \"1001:0\" /opt/airflow/\necho\necho \"Change ownership of files in shared volumes to 1001:0\"\necho\nchown -v -R \"1001:0\" /opt/airflow/{logs,dags,plugins,config}\necho\necho \"Files in shared volumes:\"\necho\nls -la /opt/airflow/{logs,dags,plugins,config}\n"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "entrypoint": [
        "/bin/bash"
      ],
      "environment": {
        "AIRFLOW_CONFIG": "/opt/airflow/config/airflow.cfg",
        "AIRFLOW__CORE__AUTH_MANAGER": "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager",
        "AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION": "true",
        "AIRFLOW__CORE__DEFAULT_TIMEZONE": "Europe/Berlin",
        "AIRFLOW__CORE__EXECUTION_API_SERVER_URL": "http://airflow-apiserver:8080/execution/",
        "AIRFLOW__CORE__EXECUTOR": "LocalExecutor",
        "AIRFLOW__CORE__FERNET_KEY": "${AIRFLOW__CORE__FERNET_KEY:?supply externally}",
        "AIRFLOW__CORE__LOAD_EXAMPLES": "false",
        "AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG": "1",
        "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN": "${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:?supply externally}",
        "AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK": "true",
        "AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT": "600",
        "AIRFLOW__WEBSERVER__WORKERS": "1",
        "_AIRFLOW_DB_MIGRATE": "true",
        "_AIRFLOW_WWW_USER_CREATE": "true",
        "_AIRFLOW_WWW_USER_PASSWORD": "${_AIRFLOW_WWW_USER_PASSWORD:?supply externally}",
        "_AIRFLOW_WWW_USER_USERNAME": "airflow",
        "_PIP_ADDITIONAL_REQUIREMENTS": ""
      },
      "image": "apache/airflow:2.10.2",
      "networks": {
        "default": null
      },
      "user": "0:0",
      "volumes": [
        {
          "type": "bind",
          "source": "/opt/airflow/dags",
          "target": "/opt/airflow/dags",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/logs",
          "target": "/opt/airflow/logs",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/plugins",
          "target": "/opt/airflow/plugins",
          "bind": {
            "create_host_path": true
          }
        }
      ]
    },
    "airflow-scheduler": {
      "command": [
        "scheduler"
      ],
      "depends_on": {
        "airflow-init": {
          "condition": "service_completed_successfully",
          "required": true
        },
        "postgres": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "entrypoint": null,
      "environment": {
        "AIRFLOW_CONFIG": "/opt/airflow/config/airflow.cfg",
        "AIRFLOW__CORE__AUTH_MANAGER": "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager",
        "AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION": "true",
        "AIRFLOW__CORE__DEFAULT_TIMEZONE": "Europe/Berlin",
        "AIRFLOW__CORE__EXECUTION_API_SERVER_URL": "http://airflow-apiserver:8080/execution/",
        "AIRFLOW__CORE__EXECUTOR": "LocalExecutor",
        "AIRFLOW__CORE__FERNET_KEY": "${AIRFLOW__CORE__FERNET_KEY:?supply externally}",
        "AIRFLOW__CORE__LOAD_EXAMPLES": "false",
        "AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG": "1",
        "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN": "${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:?supply externally}",
        "AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK": "true",
        "AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT": "600",
        "AIRFLOW__WEBSERVER__WORKERS": "1",
        "_PIP_ADDITIONAL_REQUIREMENTS": ""
      },
      "healthcheck": {
        "test": [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8974/health"
        ],
        "timeout": "10s",
        "interval": "30s",
        "retries": 5,
        "start_period": "30s"
      },
      "image": "apache/airflow:2.10.2",
      "networks": {
        "default": null
      },
      "restart": "always",
      "user": "1001:0",
      "volumes": [
        {
          "type": "bind",
          "source": "/opt/airflow/dags",
          "target": "/opt/airflow/dags",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/logs",
          "target": "/opt/airflow/logs",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/plugins",
          "target": "/opt/airflow/plugins",
          "bind": {
            "create_host_path": true
          }
        }
      ]
    },
    "airflow-triggerer": {
      "command": [
        "triggerer"
      ],
      "depends_on": {
        "airflow-init": {
          "condition": "service_completed_successfully",
          "required": true
        },
        "postgres": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "entrypoint": null,
      "environment": {
        "AIRFLOW_CONFIG": "/opt/airflow/config/airflow.cfg",
        "AIRFLOW__CORE__AUTH_MANAGER": "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager",
        "AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION": "true",
        "AIRFLOW__CORE__DEFAULT_TIMEZONE": "Europe/Berlin",
        "AIRFLOW__CORE__EXECUTION_API_SERVER_URL": "http://airflow-apiserver:8080/execution/",
        "AIRFLOW__CORE__EXECUTOR": "LocalExecutor",
        "AIRFLOW__CORE__FERNET_KEY": "${AIRFLOW__CORE__FERNET_KEY:?supply externally}",
        "AIRFLOW__CORE__LOAD_EXAMPLES": "false",
        "AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG": "1",
        "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN": "${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:?supply externally}",
        "AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK": "true",
        "AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT": "600",
        "AIRFLOW__WEBSERVER__WORKERS": "1",
        "_PIP_ADDITIONAL_REQUIREMENTS": ""
      },
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""
        ],
        "timeout": "10s",
        "interval": "30s",
        "retries": 5,
        "start_period": "30s"
      },
      "image": "apache/airflow:2.10.2",
      "networks": {
        "default": null
      },
      "restart": "always",
      "user": "1001:0",
      "volumes": [
        {
          "type": "bind",
          "source": "/opt/airflow/dags",
          "target": "/opt/airflow/dags",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/logs",
          "target": "/opt/airflow/logs",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/plugins",
          "target": "/opt/airflow/plugins",
          "bind": {
            "create_host_path": true
          }
        }
      ]
    },
    "airflow-webserver": {
      "command": [
        "webserver"
      ],
      "depends_on": {
        "airflow-init": {
          "condition": "service_completed_successfully",
          "required": true
        },
        "postgres": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "entrypoint": null,
      "environment": {
        "AIRFLOW_CONFIG": "/opt/airflow/config/airflow.cfg",
        "AIRFLOW__CORE__AUTH_MANAGER": "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager",
        "AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION": "true",
        "AIRFLOW__CORE__DEFAULT_TIMEZONE": "Europe/Berlin",
        "AIRFLOW__CORE__EXECUTION_API_SERVER_URL": "http://airflow-apiserver:8080/execution/",
        "AIRFLOW__CORE__EXECUTOR": "LocalExecutor",
        "AIRFLOW__CORE__FERNET_KEY": "${AIRFLOW__CORE__FERNET_KEY:?supply externally}",
        "AIRFLOW__CORE__LOAD_EXAMPLES": "false",
        "AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG": "1",
        "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN": "${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:?supply externally}",
        "AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK": "true",
        "AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT": "600",
        "AIRFLOW__WEBSERVER__WORKERS": "1",
        "_PIP_ADDITIONAL_REQUIREMENTS": ""
      },
      "image": "apache/airflow:2.10.2",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "target": 8080,
          "published": "8080",
          "protocol": "tcp"
        }
      ],
      "restart": "always",
      "user": "1001:0",
      "volumes": [
        {
          "type": "bind",
          "source": "/opt/airflow/dags",
          "target": "/opt/airflow/dags",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/logs",
          "target": "/opt/airflow/logs",
          "bind": {
            "create_host_path": true
          }
        },
        {
          "type": "bind",
          "source": "/opt/airflow/plugins",
          "target": "/opt/airflow/plugins",
          "bind": {
            "create_host_path": true
          }
        }
      ]
    },
    "postgres": {
      "command": null,
      "entrypoint": null,
      "environment": {
        "POSTGRES_DB": "airflow",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?supply externally}",
        "POSTGRES_USER": "airflow"
      },
      "healthcheck": {
        "test": [
          "CMD",
          "pg_isready",
          "-U",
          "airflow"
        ],
        "interval": "10s",
        "retries": 5,
        "start_period": "5s"
      },
      "image": "postgres:13",
      "networks": {
        "default": null
      },
      "restart": "always",
      "volumes": [
        {
          "type": "volume",
          "source": "postgres-db-volume",
          "target": "/var/lib/postgresql/data",
          "volume": {}
        }
      ]
    }
  },
  "volumes": {
    "postgres-db-volume": {
      "name": "airflow_postgres-db-volume"
    }
  },
  "x-airflow-common": {
    "depends_on": {
      "postgres": {
        "condition": "service_healthy"
      }
    },
    "environment": {
      "AIRFLOW_CONFIG": "/opt/airflow/config/airflow.cfg",
      "AIRFLOW__CORE__AUTH_MANAGER": "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager",
      "AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION": "true",
      "AIRFLOW__CORE__DEFAULT_TIMEZONE": "Europe/Berlin",
      "AIRFLOW__CORE__EXECUTION_API_SERVER_URL": "http://airflow-apiserver:8080/execution/",
      "AIRFLOW__CORE__EXECUTOR": "LocalExecutor",
      "AIRFLOW__CORE__FERNET_KEY": "",
      "AIRFLOW__CORE__LOAD_EXAMPLES": "false",
      "AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG": "1",
      "AIRFLOW__DATABASE__SQL_ALCHEMY_CONN": "postgresql+psycopg2://airflow:airflow@postgres/airflow",
      "AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK": "true",
      "AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT": "600",
      "AIRFLOW__WEBSERVER__WORKERS": "1",
      "_PIP_ADDITIONAL_REQUIREMENTS": ""
    },
    "image": "apache/airflow:2.10.2",
    "user": "1001:0",
    "volumes": [
      "./dags:/opt/airflow/dags",
      "./logs:/opt/airflow/logs",
      "./config:/opt/airflow/config",
      "./plugins:/opt/airflow/plugins"
    ]
  }
}
